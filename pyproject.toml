[project]
name = "fake-news-mgnn-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soham", email = "acad.soham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "google-genai>=2.26.0",
    "huggingface-hub>=1.25.1",
    "pillow>=12.3.0",
    "protobuf>=7.35.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "sentencepiece>=0.2.2",
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    "torchvision>=0.18.0",
]

[project.scripts]
fake-news-mgnn-rag = "fake_news_mgnn_rag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
